<!DOCTYPE html>
<html>
<head>
    <title>Bier verwijderen</title>
</head>
<body>

<h2>Bier verwijderen</h2>

ID van bier:<br>
<input type="number" name="id" required><br><br>

<button onclick="verwijderBier()">Verwijder bier</button>
<script>
    function verwijderBier() {
        const id = document.querySelector('input[name="id"]').value;

        fetch(`http://localhost/bierproject/bier.php?id=${id}`, {
            method: 'DELETE'
        })
        .then(response => response.text())
        .then(data => {
            alert(data);
        })
        .catch(error => {
            console.error('Error:', error);
        });
    }
    </script>
<br>
<a href="front.html">⬅ Terug</a>

</body>
</html>
